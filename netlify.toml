[build]
  command = "npm run build"
  publish = "dist"

[[plugins]]
  package = "@netlify/plugin-lighthouse"

[build.environment]
  NODE_VERSION = "18"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 301 redirects for old CLI URLs (before adding -cli suffix)
[[redirects]]
  from = "/billingo"
  to = "/billingo-cli"
  status = 301
  force = true

[[redirects]]
  from = "/klarna"
  to = "/klarna-cli"
  status = 301
  force = true

